syntax = "proto3";

package cme.runtime.v1;

// Immutable deployment graph consumed by the runtime boundary. It contains no
// editor QObject or GraphModel references.
enum PortDirection {
  PORT_DIRECTION_UNSPECIFIED = 0;
  PORT_DIRECTION_INPUT = 1;
  PORT_DIRECTION_OUTPUT = 2;
}

enum PortCardinality {
  PORT_CARDINALITY_UNSPECIFIED = 0;
  PORT_CARDINALITY_SINGLE = 1;
  PORT_CARDINALITY_MULTI = 2;
}

enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  DELIVERY_MODE_AT_MOST_ONCE = 1;
  DELIVERY_MODE_AT_LEAST_ONCE = 2;
}

enum DeploymentValidationSeverity {
  DEPLOYMENT_VALIDATION_SEVERITY_UNSPECIFIED = 0;
  DEPLOYMENT_VALIDATION_SEVERITY_ERROR = 1;
  DEPLOYMENT_VALIDATION_SEVERITY_WARNING = 2;
}

message ComponentPort {
  string port_id = 1;
  PortDirection direction = 2;
  string message_type = 3;
  PortCardinality cardinality = 4;
  bool required = 5;
  string token_key = 6;
}

message ComponentInstance {
  string instance_id = 1;
  string component_type = 2;
  map<string, string> properties = 3;
  uint32 state_schema_version = 4;
  repeated ComponentPort ports = 5;
  // A composite component references an immutable graph definition. Empty means native handler.
  string composite_graph_id = 6;
  string composite_graph_version = 7;
  string component_identity = 8;
  string component_version = 9;
  string metadata_snapshot = 10;
}

message ExposedPort {
  string port_id = 1;
  PortDirection direction = 2;
  string message_type = 3;
  string internal_instance_id = 4;
  string internal_port_id = 5;
}

message GraphDefinition {
  string graph_id = 1;
  string graph_version = 2;
  repeated ExposedPort exposed_ports = 3;
  repeated ComponentInstance components = 4;
  repeated DirectRoute routes = 5;
}

message DirectRoute {
  string connection_id = 1;
  string source_instance_id = 2;
  string source_port_id = 3;
  string target_instance_id = 4;
  string target_port_id = 5;
  string message_type = 6;
  bool enabled = 7;
  DeliveryMode delivery_mode = 8;
  string ordering_key = 9;
  string filter = 10;
  string token_key = 11;
}

message DeploymentGraph {
  string graph_version = 1;
  repeated ComponentInstance components = 2;
  repeated DirectRoute routes = 3;
  string graph_id = 4;
  repeated GraphDefinition graph_definitions = 5;
}

message DeploymentValidationIssue {
  string code = 1;
  DeploymentValidationSeverity severity = 2;
  string field_path = 3;
  string message = 4;
}

message DeploymentValidationResult {
  bool valid = 1;
  repeated DeploymentValidationIssue issues = 2;
}
